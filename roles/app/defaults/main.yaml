---
# Каталог приложения на сервере
app_dir: "/opt/{{ app_name }}"

# Порт внутри контейнера и порт на хосте (127.0.0.1), куда проксирует nginx
app_port: 3000
app_http_port: 8080

# Переменные окружения (шаблонизируются в .env) — задаются в group_vars
app_env: {}

# Git-источник (пустая строка — код уже лежит в app_dir)
git_repo: ""
git_branch: main