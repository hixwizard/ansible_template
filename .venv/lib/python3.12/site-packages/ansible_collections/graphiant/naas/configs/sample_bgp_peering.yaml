# BGP Peering Configuration
# ============================================================
# Configure BGP neighbors, routing policy attachments,route aggregations, and bgp Multipath
# per device and LAN segment.
#
# Top-level structure:
#   bgpPeering:
#     - YOUR_DEVICE_NAME:
#         routePolicies: [OPTIONAL] Global routing policies to attach at the device level.
#                         Must be created first using graphiant_global_config.
#         segments:       [REQUIRED] List of LAN segments to configure BGP on.
#           - lanSegment: YOUR_LAN_SEGMENT_NAME
#             neighbors:        [OPTIONAL] List of BGP neighbor peers.
#             bgpAggregations: [OPTIONAL] List of prefixes to aggregate.
#             ebgpMultipath:    [OPTIONAL] true/false to enable eBGP multipath on the segment.
#
# Note: Each segment may define neighbors, bgpAggregations, or both.
#
# Field names: camelCase is the documented form (edge-1/edge-3 below). The original
# snake_case names (e.g. remote_ipv4_address, peer_as, lan_segment) are still accepted
# as aliases — edge-2 below uses them to demonstrate. camelCase wins if both are given.
#
# Per-entry removal: under operation: configure (state: present), add
# `state: absent` to an individual neighbor or aggregation to remove just
# that entry while the rest of the device is configured normally — no full
# deconfigure required.
#
# Per-policy detach: under operation: configure, set a neighbor filter field
# (ipv4InboundFilter, ipv4OutboundFilter, ipv6InboundFilter,
# ipv6OutboundFilter) to `absent` to detach just that routing policy while
# keeping the neighbor. Omitting the field leaves the attached policy unchanged.
# ============================================================

bgpPeering:
  - edge-1-sdktest:
      # Example: BGP neighbors, BGP Multipath and route aggregations on the same segment,
      # with global routing policies attached at the device level.
      routePolicies:                       # [OPTIONAL] Global routing policy names to attach at device level
        - demo_bgp_inbound_filter
        - demo_bgp_outbound_filter
      segments:
        - lanSegment: lan-7-test
          ebgpMultipath: true       # [OPTIONAL] Enable eBGP multipath on this segment (default: off)
          neighbors:
            - remoteIpv4Address: 10.1.17.11
              peerAs: 60011
              localInterface: GigabitEthernet7/0/0.18
              ipv4InboundFilter: demo_bgp_inbound_filter
              ipv4OutboundFilter: demo_bgp_outbound_filter
              holdTimer: 180
              keepaliveTimer: 60
              ebgpMultiHop: 1
              asOverride: false
              remotePrivateAs: false
              allowAsIn: 1
              # sendCommunity: true
              # md5Password: "mustchangeme"   # leave null/absent to fill from Ansible Vault
              #                                # (vault_bgp_peering_md5_passwords: {device: {address: pwd}})
              bfd: true
              minimumInterval: 1200 # in milliseconds, Range: 250-30000 (default: 1000)
              localMultiplier: 4 # Range: 1-255 (default: 3)
          bgpAggregations:
            - prefix: 1.1.1.0/27      # [REQUIRED] Network prefix to aggregate (CIDR notation)
              asSet: true            # [OPTIONAL] Include AS set info in aggregated route (default: false)
              summaryOnly: true      # [OPTIONAL] Suppress more-specific routes (default: false)

  - edge-2-sdktest:
      # Example: this device intentionally uses the legacy snake_case field names to show
      # they are still accepted (aliases). camelCase (edge-1/edge-3) is the documented form;
      # both produce the same config. Do not mix both spellings of the same field on one entry.
      route_policies:
        - demo_bgp_inbound_filter
        - demo_bgp_outbound_filter
      segments:
        - lan_segment: lan-7-test
          neighbors:
            - remote_ipv4_address: 10.3.177.11
              peer_as: 60021
              ipv4_inbound_filter: absent                    # Example: per-policy detach — detach just
              ipv4_outbound_filter: demo_bgp_outbound_filter  # the inbound policy, keep the neighbor.
              bfd: true
          bgp_aggregations:                 # snake_case aggregation (alias of bgpAggregations)
            - prefix: 3.3.3.0/27
              as_set: true                  # alias of asSet
              summary_only: true            # alias of summaryOnly
        - lan_segment: lan-8-test
          neighbors:
            - remote_ipv4_address: 10.2.18.11
              peer_as: 60023
              local_interface: GigabitEthernet8/0/0.29
              ipv4_inbound_filter: demo_bgp_inbound_filter
              ipv4_outbound_filter: demo_bgp_outbound_filter
            - remote_ipv4_address: 10.2.188.11
              peer_as: 60024
              local_interface: GigabitEthernet8/0/0.30
              ipv4_inbound_filter: demo_bgp_inbound_filter
              ipv4_outbound_filter: demo_bgp_outbound_filter
            - remote_ipv4_address: 10.2.188.12   # Example: per-neighbor removal — this peer is deleted
              peer_as: 60025                      # under 'configure' (state: absent); others stay.
              state: absent

  - edge-3-sdktest:
      # Example: BGP aggregations only, no neighbors.
      segments:
        - lanSegment: lan-segment-3
          bgpAggregations:
            - prefix: 1.1.1.0/27      # [REQUIRED] Network prefix to aggregate (CIDR notation)
              asSet: true            # [OPTIONAL] Include AS set info in aggregated route (default: false)
              summaryOnly: true      # [OPTIONAL] Suppress more-specific routes (default: false)
            - prefix: 2.1.1.0/27      # Example: per-entry removal — this aggregation is deleted
              state: absent          # under 'configure' while 1.1.1.0/27 above stays configured.