---
# Первичная настройка сервера: базовые пакеты, пользователь deploy,
# SSH-ключ, файрвол (UFW) и установка Docker.
#
# Запуск (первый раз под root):
#   make setup SSH_USER=root
# или:
#   ansible-playbook -i inventory/production/hosts.yaml -u root playbooks/setup.yaml
#
# Плейбук идемпотентен — безопасно перезапускать.
- name: Первичная настройка сервера
  hosts: all
  become: true
  roles:
    - role: common
    - role: docker
