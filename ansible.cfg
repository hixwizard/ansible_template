[defaults]
inventory = inventory/production/hosts.yaml
remote_user = deploy
private_key_file = ~/.ssh/id_rsa
host_key_checking = False
retry_files_enabled = False
stdout_callback = yaml
interpreter_python = /usr/bin/python3
timeout = 30
roles_path = roles

[ssh_connection]
pipelining = True

[privilege_escalation]
become = True
become_method = sudo
become_user = root